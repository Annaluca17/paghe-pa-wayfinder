# Aggiunta FITTIZIA al corpus reale per il "mese di prova" (ticket #68).
#
# Si carica DOPO corpus/funzioni-locali-cpdel.toml, unita al testo del corpus reale, e il corpus che ne risulta e
# NON reale (Corpus.da_toml(..., reale=False)): il corpus reale rifiuta i riferimenti `fittizio:` (ADR 0003).
#
# Tutti i riferimenti qui sono `fittizio:`. I valori fiscali (franchigia, aliquota, detrazione) sono dichiaratamente
# finti e non corrispondono a nessuna norma. Questo file da' valori ai parametri e alle dichiarazioni che mancano
# al corpus reale (categorie di reddito, ritenuta, conguaglio, composizione, mappatura, catalogo dei codici F24EP,
# scadenza, festivi) e dichiara due istituti che leggono un fatto (performance, rimborso 730): nessuna regola di
# calcolo nuova, solo l'input da atto letto cosi' com'e'. I codici tributo sono quelli di
# docs/research/versamenti-f24ep.md.

# --- Parametri fiscali: valori finti ---

[[parametro]]
nome = "ritenuta_franchigia_annua"
[[parametro.vigenza]]
dal = 2025-01-01
valore = "9999"
riferimento = "fittizio:ritenuta-franchigia-annua"

[[parametro]]
nome = "ritenuta_aliquota"
[[parametro.vigenza]]
dal = 2025-01-01
valore = "0.11"
riferimento = "fittizio:ritenuta-aliquota"

[[parametro]]
nome = "ritenuta_detrazione_annua"
[[parametro.vigenza]]
dal = 2025-01-01
valore = "1111"
riferimento = "fittizio:ritenuta-detrazione-annua"

# --- Categoria di reddito, ritenuta e conguaglio ---

[[categoria_reddito]]
nome = "lavoro_dipendente"
[[categoria_reddito.cassa_allargata]]
dal = 2025-01-01
vale = true
riferimento = "fittizio:cassa-allargata-lavoro-dipendente"

[[ritenuta]]
istituto = "ritenuta_irpef"
versione = 1
dal = 2025-01-01
riferimento = "fittizio:ritenuta-irpef"
categorie = ["lavoro_dipendente"]
detrazione_richiesta = "lavoro_dipendente"
imposta = "arrotonda(max(0, fisco.imponibile - parametro.ritenuta_franchigia_annua / fisco.periodi) * parametro.ritenuta_aliquota, 2)"
detrazione = "arrotonda(parametro.ritenuta_detrazione_annua / fisco.periodi, 2)"

[[conguaglio]]
istituto = "conguaglio_irpef"
versione = 1
dal = 2025-01-01
riferimento = "fittizio:conguaglio-irpef"

# --- Due istituti che leggono un fatto (input da atto), senza regola di calcolo ---
# La performance e' di competenza 2025 e pagata nel 2026: pagamento fisiologico dichiarato qui sotto.
# Il rimborso da 730-4 ha maturazione `periodo`: e' l'unica maturazione che non produce reddito imponibile ne' entra
# nelle basi (non e' retribuzione). Il nucleo non ha il tipo di fatto "esito 730-4": l'importo e' un fatto generico.

[[regola]]
istituto = "performance"
versione = 1
dal = 2025-01-01
riferimento = "fittizio:performance"
formula = "fatto.performance"
maturazione = "evento"
applica_se = "performance"

[[regola]]
istituto = "rimborso_irpef_730"
versione = 1
dal = 2026-01-01
riferimento = "fittizio:rimborso-irpef-730"
formula = "fatto.rimborso_irpef_730"
maturazione = "periodo"
applica_se = "rimborso_irpef_730"

[[pagamento_fisiologico]]
istituto = "performance"
dal = 2026-01-01
riferimento = "fittizio:performance-pagamento-fisiologico"

