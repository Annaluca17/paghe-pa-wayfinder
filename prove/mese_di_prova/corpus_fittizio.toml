# Aggiunta FITTIZIA al corpus reale per il "mese di prova" (ticket #68).
#
# Si carica DOPO corpus/funzioni-locali-cpdel.toml, unita al testo del corpus reale, e il corpus che ne risulta e
# NON reale (Corpus.da_toml(..., reale=False)): il corpus reale rifiuta i riferimenti `fittizio:` (ADR 0003).
#
# Tutti i riferimenti qui sono `fittizio:`. Il fisco nazionale (scaglioni IRPEF, detrazioni, categorie di reddito, ritenuta,
# conguaglio, deduzioni, parametri e regola delle addizionali, dichiarazioni di reddito degli istituti reali) e' passato nel
# corpus reale con il ticket #93: qui resta solo cio' che non ha una fonte reale. Cioe': il primo mese del rimborso 730-4,
# la categoria di reddito della performance (istituto fittizio), le aliquote dell'addizionale del comune X001 e della regione 98,
# la composizione del pagamento, la mappatura, il catalogo dei codici F24EP, la scadenza e i festivi, e gli istituti performance
# e rimborso 730-4: nessuna regola di calcolo nuova, solo l'input da atto letto cosi' com'e'. I codici tributo sono quelli di
# docs/research/versamenti-f24ep.md.

# --- Parametri: valori finti ---

# Il primo mese utile per operare il rimborso del 730-4 (dell'anno dopo i redditi dichiarati): luglio.
[[parametro]]
nome = "rimborso_730_primo_mese"
[[parametro.vigenza]]
dal = 2025-01-01
valore = "7"
riferimento = "fittizio:rimborso-730-primo-mese"

# --- Due istituti che leggono un fatto (input da atto), senza regola di calcolo ---
# La performance e' di competenza 2025 e pagata nel 2026: pagamento fisiologico dichiarato qui sotto.
# Il rimborso da 730-4 ha maturazione `periodo`: e' l'unica maturazione che non produce reddito imponibile ne' entra
# nelle basi (non e' retribuzione). Il suo importo non nasce da questa regola ma dall'esito 730-4 della persona
# (`paghe.esito_730_4.rimborso_730_4`, ticket #71): la regola c'e' perche' il corpus vuole una regola per ogni istituto
# con una composizione, e non scatta mai (nessun rapporto ha il fatto che legge).

[[regola]]
istituto = "performance"
versione = 1
dal = 2025-01-01
riferimento = "fittizio:performance"
formula = "fatto.performance"
maturazione = "evento"
applica_se = "performance"

[[regola]]
istituto = "rimborso_730_4"
versione = 1
dal = 2026-01-01
riferimento = "fittizio:rimborso-730-4"
formula = "fatto.rimborso_730_4_del_rapporto"
maturazione = "periodo"
applica_se = "rimborso_730_4_del_rapporto"

[[pagamento_fisiologico]]
istituto = "performance"
dal = 2026-01-01
riferimento = "fittizio:performance-pagamento-fisiologico"

# --- Reddito: la performance e' un istituto fittizio, la sua categoria non ha una fonte reale. Gli istituti reali sono nel corpus reale ---

[[reddito]]
istituto = "performance"
categoria = "lavoro_dipendente"
dal = 2025-01-01
riferimento = "fittizio:reddito-performance"

