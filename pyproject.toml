[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paghe-enti-locali"
version = "0.1.0"
description = "Nucleo del modello alternativo di elaborazione paghe per Enti Locali"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["paghe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
