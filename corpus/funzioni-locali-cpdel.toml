# Il trattamento integrativo spetta al lavoro dipendente e agli assimilati dell'art. 50 c. 1 lett. c-bis) TUIR (collaborazione), non alla
# carica elettiva; la somma esente al solo lavoro dipendente. Il reddito annuo stimato e' il pagato dall'inizio dell'anno diviso i giorni
# di servizio per 365 (prassi, circ. AdE 4/E/2025): lo calcola il motore. Il trattamento integrativo tra 15.000 e 28.000 euro conta le
# detrazioni note (art. 13 c. 1 e c. 1.1, carichi di famiglia dell'art. 12, ticket #98) e gli oneri comunicati dalla persona. Il corpus non porta ancora le condizioni sugli oneri
# «sostenuti fino al 31 dicembre 2021» (da verificare).
[[beneficio]]
versione = 1
dal = 2026-01-01
al = 2026-12-31
riferimento = "urn:nir:stato:decreto.legge:2020-02-05;3~art1-com1 + urn:nir:stato:decreto.legge:2020-02-05;3~art1-com3 + urn:nir:stato:legge:2024-12-30;207~art1-com3 + urn:nir:stato:legge:2024-12-30;207~art1-com4 + urn:nir:stato:legge:2024-12-30;207~art1-com7"
categorie_somma_esente = ["lavoro_dipendente"]
categorie_trattamento_integrativo = ["lavoro_dipendente", "collaborazione"]
somma_esente = '''arrotonda(
    se(fisco.reddito_stimato <= parametro.somma_esente_soglia_3,
       se(fisco.reddito_fascia <= parametro.somma_esente_soglia_1, parametro.somma_esente_percentuale_1,
          se(fisco.reddito_fascia <= parametro.somma_esente_soglia_2, parametro.somma_esente_percentuale_2,
             parametro.somma_esente_percentuale_3)), 0)
    * fisco.reddito_dipendente, 2)'''
trattamento_integrativo = '''arrotonda(
    se(fisco.reddito_stimato <= parametro.integrativo_soglia_1,
       se(fisco.imposta > fisco.detrazione - parametro.integrativo_riduzione / fisco.periodi,
          parametro.integrativo_importo * fisco.giorni / fisco.giorni_anno / fisco.periodi, 0),
       se(fisco.reddito_stimato <= parametro.integrativo_soglia_2,
          min(parametro.integrativo_importo * fisco.giorni / fisco.giorni_anno / fisco.periodi,
              max(0, fisco.detrazione + fisco.carichi + fisco.oneri / fisco.periodi - fisco.imposta)), 0)), 2)'''
istituto_somma_esente = "somma_esente"
istituto_trattamento_integrativo = "trattamento_integrativo"
recupero_somma_esente = "somma_esente_recupero"
recupero_trattamento_integrativo = "trattamento_integrativo_recupero"
soglia_recupero = "recupero_benefici_soglia"
rate_somma_esente = "recupero_somma_esente_rate"
rate_trattamento_integrativo = "recupero_integrativo_rate"

