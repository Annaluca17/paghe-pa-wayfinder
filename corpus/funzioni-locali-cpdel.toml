# Carichi di famiglia: detrazione annua di un familiare al 100%, per relazione (ADR 0033). Il figlio in luogo del
# coniuge usa quella del coniuge. R è lo stesso reddito dell'art. 13; `fisco.figli` è il numero dei figli che danno
# diritto nello stesso mese. Rapporti dell'art. 12 c. 4: coniuge, fascia 1 con rapporto 1 -> 690; rapporti delle
# fasce 1 e 3 pari a zero -> zero; figli e ascendenti, rapporto zero, negativo o uguale a uno -> zero.
carichi_coniuge = '''(se((fisco.imponibile * fisco.periodi) <= parametro.carichi_coniuge_soglia_1,
       se(tronca((fisco.imponibile * fisco.periodi) / parametro.carichi_coniuge_soglia_1, 4) <= 0,
          0,
          parametro.carichi_coniuge_importo_1 - parametro.carichi_coniuge_riduzione * tronca((fisco.imponibile * fisco.periodi) / parametro.carichi_coniuge_soglia_1, 4)),
       se((fisco.imponibile * fisco.periodi) <= parametro.carichi_coniuge_soglia_2,
          parametro.carichi_coniuge_importo_2,
          se((fisco.imponibile * fisco.periodi) <= parametro.carichi_coniuge_soglia_3,
             parametro.carichi_coniuge_importo_2 * max(0, tronca((parametro.carichi_coniuge_soglia_3 - (fisco.imponibile * fisco.periodi)) / parametro.carichi_coniuge_divisore_3, 4)),
             0)))
    + se((fisco.imponibile * fisco.periodi) > parametro.carichi_coniuge_magg_estremo_0,
         se((fisco.imponibile * fisco.periodi) <= parametro.carichi_coniuge_magg_estremo_1, parametro.carichi_coniuge_magg_importo_1,
         se((fisco.imponibile * fisco.periodi) <= parametro.carichi_coniuge_magg_estremo_2, parametro.carichi_coniuge_magg_importo_2,
         se((fisco.imponibile * fisco.periodi) <= parametro.carichi_coniuge_magg_estremo_3, parametro.carichi_coniuge_magg_importo_3,
         se((fisco.imponibile * fisco.periodi) <= parametro.carichi_coniuge_magg_estremo_4, parametro.carichi_coniuge_magg_importo_4,
         se((fisco.imponibile * fisco.periodi) <= parametro.carichi_coniuge_magg_estremo_5, parametro.carichi_coniuge_magg_importo_5, 0))))),
         0))'''
carichi_figlio = '''se(tronca(((parametro.carichi_figlio_soglia + parametro.carichi_figlio_aumento * max(0, fisco.figli - 1)) - (fisco.imponibile * fisco.periodi)) / (parametro.carichi_figlio_soglia + parametro.carichi_figlio_aumento * max(0, fisco.figli - 1)), 4) <= 0,
   0,
   se(tronca(((parametro.carichi_figlio_soglia + parametro.carichi_figlio_aumento * max(0, fisco.figli - 1)) - (fisco.imponibile * fisco.periodi)) / (parametro.carichi_figlio_soglia + parametro.carichi_figlio_aumento * max(0, fisco.figli - 1)), 4) >= 1,
      0,
      parametro.carichi_figlio_importo * tronca(((parametro.carichi_figlio_soglia + parametro.carichi_figlio_aumento * max(0, fisco.figli - 1)) - (fisco.imponibile * fisco.periodi)) / (parametro.carichi_figlio_soglia + parametro.carichi_figlio_aumento * max(0, fisco.figli - 1)), 4)))'''
carichi_ascendente = '''se(tronca((parametro.carichi_ascendente_soglia - (fisco.imponibile * fisco.periodi)) / parametro.carichi_ascendente_soglia, 4) <= 0,
   0,
   se(tronca((parametro.carichi_ascendente_soglia - (fisco.imponibile * fisco.periodi)) / parametro.carichi_ascendente_soglia, 4) >= 1,
      0,
      parametro.carichi_ascendente_importo * tronca((parametro.carichi_ascendente_soglia - (fisco.imponibile * fisco.periodi)) / parametro.carichi_ascendente_soglia, 4)))'''
imposta = '''arrotonda(
    (parametro.irpef_aliquota_1 * min((fisco.imponibile * fisco.periodi), parametro.irpef_limite_1)
     + parametro.irpef_aliquota_2 * max(0, min((fisco.imponibile * fisco.periodi), parametro.irpef_limite_2) - parametro.irpef_limite_1)
     + parametro.irpef_aliquota_3 * max(0, (fisco.imponibile * fisco.periodi) - parametro.irpef_limite_2)) / fisco.periodi, 2)'''
detrazione = '''arrotonda(
    se((fisco.imponibile * fisco.periodi) <= parametro.art13_soglia_a,
       max(parametro.art13_importo_a * fisco.giorni / fisco.giorni_anno, parametro.art13_minimo_a),
       (se((fisco.imponibile * fisco.periodi) <= parametro.art13_soglia_b,
           parametro.art13_importo_b_c + parametro.art13_integrazione_b * tronca((parametro.art13_soglia_b - (fisco.imponibile * fisco.periodi)) / parametro.art13_divisore_b, 4),
           se((fisco.imponibile * fisco.periodi) <= parametro.art13_soglia_c,
              parametro.art13_importo_b_c * tronca((parametro.art13_soglia_c - (fisco.imponibile * fisco.periodi)) / parametro.art13_divisore_c, 4),
              0))
        + se((fisco.imponibile * fisco.periodi) > parametro.art13_aumento_da, se((fisco.imponibile * fisco.periodi) <= parametro.art13_aumento_fino_a, parametro.art13_aumento, 0), 0))
       * fisco.giorni / fisco.giorni_anno) / fisco.periodi, 2)'''
detrazione_automatica = '''arrotonda(
    se((fisco.imponibile * fisco.periodi) > parametro.ulteriore_soglia_1,
       se((fisco.imponibile * fisco.periodi) <= parametro.ulteriore_soglia_2,
          parametro.ulteriore_importo,
          se((fisco.imponibile * fisco.periodi) <= parametro.ulteriore_soglia_3,
             parametro.ulteriore_importo * (parametro.ulteriore_soglia_3 - (fisco.imponibile * fisco.periodi)) / parametro.ulteriore_divisore,
             0)),
       0) * fisco.giorni / fisco.giorni_anno / fisco.periodi, 2)'''

