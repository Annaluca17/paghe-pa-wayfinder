# Corpus reale: CPDEL, Fondo Credito, TFS e TFR di un dipendente del comparto Funzioni Locali.
# Ticket #29, parte 2; TFS e TFR dal ticket #33, parti 1 e 2. Si carica con Corpus.carica(percorso, reale=True), che rifiuta i
# riferimenti fittizi (ADR 0003). Copertura: competenze e pagamenti dal 01/01/2026.
#
# Stato delle fonti (riscontro nel ticket #29):
#   norma certa           aliquote CPDEL e Fondo Credito, aliquota aggiuntiva 1%, prima fascia
#                         2026, tab. B e C del CCNL 28/10/2026
#                         TFS ex INADEL 6,10% sull'80%, ente 3,60, iscritto 2,50 (L. 152/1968
#                         art. 11; msg INPS 2440/2019); comparto escluso dal TFS (art. 33 c. 3
#                         CCNL 22/01/2004). TFR 6,10% sull'80% a carico dell'ente e
#                         ulteriori elementi al 6,91% (DPCM 20/12/1999 art. 1 c. 6-7; msg
#                         INPS 2440/2019). Riscontro nel ticket #33
#   da verificare         massimale 2026: letto nella Circ. INPS 6/2026 § 6, la seconda fonte
#                         è solo una fonte secondaria; qui serve solo a fermare la denuncia.
#                         Art. 74 c. 4 CCNL 16/11/2022 ancora vigente dopo i CCNL del 2026
#   prassi-interpretazione  tabellare mensile, divisore del mese parziale, arrotondamento delle
#                         quote CPDEL e TFS, 1% sull'ultimo periodo, imponibile TFS all'80%
#                         arrotondato prima dell'aliquota, riduzione del lordo TFR e sua
#                         esclusione dalle basi: note di prassi 1, 2, 3, 4 e 5

[periodo_dichiarato]
servizio = "tipo_impiego"
# ADR 0005: aprono un periodo i cambi di questi codici. Il servizio è sempre compreso.
fatti = [
    "tipo_servizio",
    "contratto",
    "qualifica",
    "part_time",
    "regime_fine_servizio",
    "percentuale_retribuzione",
    "aspettativa_sindacale",
    "altra_amministrazione",
]

[denuncia]
persona = "codice_fiscale"
massimale = { base = "cpdel", parametro = "massimale_annuo" }
conguaglio_annuo = ["contributo_aggiuntivo"]

# Fermi: casi che la prima fetta non modella (ADR 0005, nota di prassi 3).

# Il fermo con ambito vista sul regime è tolto: GestPrevidenziale è esposta (ticket #33, parte 3).

[[fermo]]
fatto = "regime_fine_servizio"
codice = "2"
caso = "optante TFR, doppio imponibile TFS e TFR non modellato"
# Decisione di Luca, ticket #33: optanti fuori dalla scheda.
ambito = "denuncia"
riferimento = "prassi:inps:circolare:2021-12-14;185~par2.2.1 + prassi:immedia:nota:2026-11-06;4"

