# --- Ritenuta e conguaglio dell'IRPEF ---
# Il reddito della fascia e' l'imponibile del periodo per i periodi dell'anno (nel conguaglio, l'imponibile dell'anno).
# L'imposta e' la somma dei tratti degli scaglioni ragguagliati al periodo, arrotondata al centesimo. La detrazione dell'art. 13
# c. 1 (con l'aumento del c. 1.1) si applica solo con la dichiarazione del sostituito (art. 23 c. 2 D.P.R. 600/1973); l'ulteriore
# detrazione si applica sempre (L. 207/2024 c. 7). Rapportate al periodo di lavoro: nel conguaglio giorni di servizio / giorni
# dell'anno (prassi: circolare AdE 15/E 2007, istruzioni 730/2026; il testo dice solo «rapportata al periodo di lavoro»); il
# minimo di 690 euro si applica dopo il rapporto e solo con reddito fino a 15.000. Nella ritenuta del mese i giorni non pesano.
# Marcatura: norma certa per scaglioni e importi, prassi per il criterio dei giorni. Il minimo di 1.380 per il tempo determinato
# non e' applicato: lo segnala un avviso.
# I rapporti delle fasce b) e c) si troncano alle prime quattro cifre decimali (art. 13 c. 6 TUIR, c. 8 TU; troncamento:
# prassi-interpretazione, da verificare). L'ulteriore detrazione spetta solo con reddito di lavoro dipendente (L. 207/2024 c. 6).

