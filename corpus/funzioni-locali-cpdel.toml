# TFR solo con il regime 1. Riduzione del lordo pari al contributo soppresso del 2,50%
# sull'80% delle voci utili al TFS (DPCM art. 1 c. 2-3). È per competenza e non entra in
# nessuna base: le basi restano sul lordo prima della riduzione, cioè l'incremento figurativo
# del c. 3 (nota di prassi 5). La formula elenca le voci che concorrono alla base tfs: un test
# la tiene allineata.

[[regola]]
istituto = "riduzione_tfr"
versione = 1
dal = 2026-01-01
riferimento = "urn:nir:presidente.consiglio.ministri:decreto:1999-12-20~art1-com3 + prassi:immedia:nota:2026-11-06;5"
formula = "-arrotonda(arrotonda((importo.posizione_dirigenti + importo.tabellare_dirigenti + importo.posizione_segretario + importo.tabellare_segretario_a + importo.tabellare_segretario_b + importo.tabellare_segretario_c + importo.tabellare_funzionari + importo.tabellare_istruttori + importo.tabellare_operatori_esperti + importo.tabellare_operatori) * parametro.quota_imponibile_tfs / 100, 2) * parametro.aliquota_tfs_lavoratore / 100, 2)"
maturazione = "periodo"
applica_se = "regime_fine_servizio=1"

[[regola]]
istituto = "imponibile_tfr"
versione = 1
dal = 2026-01-01
riferimento = "urn:nir:presidente.consiglio.ministri:decreto:1999-12-20~art1-com7 + prassi:inps:circolare:2021-12-14;185~par2.2.1 + prassi:immedia:nota:2026-11-06;4"
formula = "arrotonda(base.tfs * parametro.quota_imponibile_tfs / 100, 2)"
maturazione = "periodo"
applica_se = "regime_fine_servizio=1"

[[regola]]
