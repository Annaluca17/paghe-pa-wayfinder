# Gestione separata INPS (ticket #73, PR B): base propria dei compensi di collaborazione. Nessun altro istituto
# vi concorre; gli istituti del lavoro dipendente ne sono esclusi per dichiarazione (art. 2 c. 26 L. 335/1995).
