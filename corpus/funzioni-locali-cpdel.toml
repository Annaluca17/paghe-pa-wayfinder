# Art. 86 c. 2 TUEL: all'amministratore che non e' lavoratore dipendente e che ha la carica del c. 1 spetta una quota
# forfettaria annuale, a carico dell'ente, versata per quote mensili verso la gestione separata (ADR 0016). La regola
# decide il diritto: carica, condizione lavorativa e posizione previdenziale; se non spetta non nasce nessun importo.
# Minimale e aliquota sono parametri; la quota e' un onere dell'ente, non reddito e non base (maturazione `onere`).

[[regola]]
istituto = "onere_art86"
versione = 1
dal = 2026-01-01
riferimento = "urn:nir:stato:decreto.legislativo:2000-08-18;267~art86-com2 + prassi:inps:circolare:2001-11-21;205 + prassi:immedia:nota:2026-11-07;10"
formula = "arrotonda(arrotonda(parametro.minimale_gs * parametro.aliquota_gs_amministratori / 100, 2) / 12, 2)"
maturazione = "onere"
applica_se = "carica=sindaco"
anche_se = ["condizione_lavorativa=non_dipendente", "posizione_previdenziale=gestione_separata"]
conteggio = "calendario"
decimali = 2

[[condizione_di_proposta]]
istituto = "compenso_collaborazione"
fatto = "attestazione_prestazione"
dal = 2026-01-01
riferimento = "prassi:immedia:nota:2026-11-07;10"

