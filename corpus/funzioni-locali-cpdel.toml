# Mappature degli elementi della DenunciaIndividuale dei tempi determinati (ADR 0027, ticket #77): il codice
# dell'elemento per il valore di un fatto del rapporto. Nessun codice sta nel programma.

# Qualifica3: «A» tempo determinato per sostituzione di lavoratori assenti (dal 01/2013), «D» restanti tipologie.
# Allegato tecnico 4.33.1, p. 110; msg INPS 4152/2014 par. 1.1. Norma certa sui codici.

[[mappatura_fatto]]
sistema = "uniemens.denuncia_individuale"
elemento = "Qualifica3"
fatto = "termine_per_sostituzione"
valore = "si"
codice = "A"
dal = 2013-01-01
riferimento = "prassi:inps:documento.tecnico:2026-10-30;4.33.1~pag110 + prassi:inps:messaggio:2014-04-17;4152~par1.1"

[[mappatura_fatto]]
sistema = "uniemens.denuncia_individuale"
elemento = "Qualifica3"
fatto = "termine_per_sostituzione"
valore = "no"
codice = "D"
dal = 2013-01-01
riferimento = "prassi:inps:documento.tecnico:2026-10-30;4.33.1~pag110"

# Qualifica1: «2» impiegato. Il codice è certo (Allegato tecnico 4.33.1, pp. 108-109) e la circolare INPS 31/2025
# par. 3 lo vuole per i tempi determinati delle pubbliche amministrazioni con contratti dell'art. 3-ter D.L. 44/2023;
# per le aree del comparto (operatori, operatori esperti, istruttori, funzionari) non c'è una regola di
# corrispondenza letta sul testo: DA VERIFICARE (docs/research/uniemens-privatistico-tempo-determinato.md § 2.2).

[[mappatura_fatto]]
sistema = "uniemens.denuncia_individuale"
elemento = "Qualifica1"
fatto = "area"
valore = "funzionari"
codice = "2"
dal = 2026-01-01
riferimento = "prassi:inps:documento.tecnico:2026-10-30;4.33.1~pag108 + prassi:inps:circolare:2025-01-30;31~par3"

[[mappatura_fatto]]
sistema = "uniemens.denuncia_individuale"
elemento = "Qualifica1"
fatto = "area"
