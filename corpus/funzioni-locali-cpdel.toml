versione = 1
dal = 2026-01-01
riferimento = "urn:nir:presidente.consiglio.ministri:decreto:1999-12-20~art1-com7 + prassi:inps:messaggio:2019-07-01;2440"
formula = "arrotonda(importo.imponibile_tfr * parametro.aliquota_tfr / 100, 2)"
maturazione = "periodo"

[[regola]]
istituto = "contributo_tfr_ulteriori"
versione = 1
dal = 2026-01-01
riferimento = "prassi:inps:messaggio:2019-07-01;2440 + urn:nir:presidente.consiglio.ministri:decreto:1999-12-20~art1-com6"
formula = "arrotonda(base.tfr_ulteriori * parametro.aliquota_tfr_ulteriori / 100, 2)"
maturazione = "periodo"
applica_se = "regime_fine_servizio=1"

# RetribValutabileTFR: retribuzione corrisposta utile al TFR, al 100% e per cassa.
[[regola]]
istituto = "retribuzione_valutabile_tfr"
versione = 1
dal = 2026-01-01
riferimento = "prassi:inps:circolare:2021-12-14;185~par2.2.1"
formula = "base.tfs + base.tfr_ulteriori"
maturazione = "periodo"
applica_se = "regime_fine_servizio=1"

# 1% sul totale del mese oltre la prima fascia mensile, sull'ultimo periodo (nota di prassi 2).

[[regola]]
istituto = "contributo_aggiuntivo"
versione = 1
dal = 2026-01-01
riferimento = "urn:nir:stato:decreto.legge:1992-09-19;384~art3ter + prassi:inps:circolare:2026-01-30;6~par5 + prassi:immedia:nota:2026-11-06;2"
formula = "arrotonda(max(base.cpdel - parametro.prima_fascia_mensile, 0) * parametro.aliquota_aggiuntiva / 100, 2)"
maturazione = "mese"

# Gestione separata del collaboratore (ticket #73, PR B): il totale al tasso della posizione previdenziale, un terzo al
# collaboratore (arrotondato) e il resto all'ente, per differenza come la CPDEL (nota di prassi 3). Nota di prassi 10.

[[regola]]
istituto = "gs_totale_piena"
versione = 1
dal = 2026-01-01
riferimento = "urn:nir:stato:legge:1995-08-08;335~art2-com26 + prassi:inps:circolare:2026-02-03;8~par1 + prassi:immedia:nota:2026-11-07;10"
formula = "arrotonda(base.gestione_separata * (parametro.aliquota_gs_ivs + parametro.aliquota_gs_aggiuntive + parametro.aliquota_gs_dis_coll) / 100, 2)"
maturazione = "periodo"
applica_se = "posizione_previdenziale=gestione_separata"

[[regola]]
istituto = "gs_totale_pensionato"
versione = 1
dal = 2026-01-01
riferimento = "urn:nir:stato:legge:2007-12-24;247~art1-com79 + prassi:inps:circolare:2026-02-03;8~par1 + prassi:immedia:nota:2026-11-07;10"
formula = "arrotonda(base.gestione_separata * (parametro.aliquota_gs_ivs_ridotta + parametro.aliquota_gs_aggiuntive) / 100, 2)"
maturazione = "periodo"
applica_se = "posizione_previdenziale=pensionato"

[[regola]]
istituto = "gs_totale_altra_cassa"
versione = 1
dal = 2026-01-01
riferimento = "urn:nir:stato:legge:2007-12-24;247~art1-com79 + prassi:inps:circolare:2026-02-03;8~par1 + prassi:immedia:nota:2026-11-07;10"
formula = "arrotonda(base.gestione_separata * (parametro.aliquota_gs_ivs_ridotta + parametro.aliquota_gs_aggiuntive) / 100, 2)"
maturazione = "periodo"
applica_se = "posizione_previdenziale=altra_cassa"

[[regola]]
istituto = "gs_totale"
versione = 1
dal = 2026-01-01
riferimento = "prassi:inps:circolare:2026-02-03;8~par4.1 + prassi:immedia:nota:2026-11-07;10"
formula = "importo.gs_totale_piena + importo.gs_totale_pensionato + importo.gs_totale_altra_cassa"
maturazione = "periodo"

[[regola]]
istituto = "gs_lavoratore"
versione = 1
dal = 2026-01-01
riferimento = "urn:nir:stato:legge:1995-08-08;335~art2-com30 + prassi:inps:circolare:2026-02-03;8~par4.1 + prassi:immedia:nota:2026-11-07;10"
formula = "arrotonda(importo.gs_totale / parametro.divisore_quota_collaboratore_gs, 2)"
maturazione = "periodo"

[[regola]]
istituto = "gs_ente"
versione = 1
dal = 2026-01-01
riferimento = "urn:nir:stato:legge:1995-08-08;335~art2-com30 + prassi:inps:circolare:2026-02-03;8~par4.1 + prassi:immedia:nota:2026-11-07;10"
formula = "importo.gs_totale - importo.gs_lavoratore"
maturazione = "periodo"

# IRAP: acconto mensile a carico dell'ente sulla base dei pagamenti del mese (art. 30 c. 5 D.Lgs. 446/1997). Arrotondato al
# centesimo come i contributi. Non e' reddito ne' base: matura sul pagato come i contributi.
[[regola]]
istituto = "irap_acconto"
versione = 1
dal = 2026-01-01
riferimento = "urn:nir:stato:decreto.legislativo:1997-12-15;446~art30-com5 + urn:nir:stato:decreto.legislativo:1997-12-15;446~art16-com2"
formula = "arrotonda(max(base.irap - importo.gs_lavoratore, 0) * parametro.aliquota_irap / 100, 2)"
maturazione = "periodo"

